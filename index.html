<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Suppress Vite's transient WebSocket and HMR connection errors in this dev environment
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (
          event.reason.message?.includes('WebSocket') || 
          event.reason.message?.includes('websocket') || 
          event.reason.message?.includes('HMR') ||
          String(event.reason).includes('WebSocket') ||
          String(event.reason).includes('websocket')
        )) {
          console.warn('Swallowed transient sandbox WebSocket rejection:', event.reason);
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (event.message && (
          event.message.includes('WebSocket') || 
          event.message.includes('websocket') ||
          event.message.includes('HMR')
        )) {
          console.warn('Swallowed transient sandbox WebSocket error:', event.message);
          event.preventDefault();
        }
      }, true); // capture phase to handle resource/web-socket level errors
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Diario El Dorrego: Prensa Infantil del Barrio El Alero en Santa Fe. Espacio de comunicación y periodismo comunitario realizado por niños y niñas." />
    <meta name="keywords" content="El Dorrego, Prensa Infantil, El Alero, Santa Fe, Diario, Niños, Comunicación Comunitaria" />
    <meta property="og:title" content="El Dorrego - Prensa Infantil - El Alero Santa Fe" />
    <meta property="og:description" content="Diario El Dorrego: Prensa Infantil del Barrio El Alero en Santa Fe. Espacio de comunicación y periodismo comunitario realizado por niños y niñas." />
    <meta property="og:type" content="website" />
    <title>El Dorrego - Prensa Infantil - El Alero Santa Fe</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
