<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Quietly suppress Vite's transient WebSocket and HMR connection errors in this sandboxed preview env
      window.addEventListener('unhandledrejection', function(event) {
        const reasonStr = event.reason ? String(event.reason.message || event.reason) : '';
        if (
          reasonStr.includes('WebSocket') || 
          reasonStr.includes('websocket') || 
          reasonStr.includes('HMR') ||
          reasonStr.includes('WS')
        ) {
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('error', function(event) {
        const msgStr = event.message ? String(event.message) : '';
        if (
          msgStr.includes('WebSocket') || 
          msgStr.includes('websocket') ||
          msgStr.includes('HMR') ||
          msgStr.includes('WS')
        ) {
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta property="og:type" content="website" />
    <title>El Dorrego - Prensa Infantil - El Alero Santa Fe</title>
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
